name: Update profile graphic

on:
  # Refresh manually from Actions, on source changes, or each Monday at 06:17 UTC.
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate.py
      - .github/workflows/update-profile.yml

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: false

      - name: Generate profile graphics
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          # Opt in only after adding PROFILE_READ_TOKEN with private repo access.
          INCLUDE_PRIVATE: 'true'
        run: uv run --no-project scripts/generate.py

      - name: Commit updated graphics
        run: |
          git add assets/profile-light.svg assets/profile-dark.svg
          if git diff --cached --quiet; then
            echo "Profile graphics are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update profile graphics"
          git push
